<!-- Replace FORMSPREE_ENDPOINT with your Formspree endpoint (see instructions) -->
<form id="contactForm" method="POST" action="https://formspree.io/f/FORMSPREE_ENDPOINT">
  <label>Name
    <input type="text" name="name" required>
  </label>
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>Phone
    <input type="tel" name="phone">
  </label>
  <label>Service / Message
    <textarea name="message" rows="5" required></textarea>
  </label>
  <button class="btn" type="submit">Send Message</button>
</form>

<p class="muted">Or email: <a href="mailto:arslanmalik329@gmail.com">arslanmalik329@gmail.com</a></p>
